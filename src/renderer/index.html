<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' snapsolve:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>snapsolve</title>
    <link rel="stylesheet" href="katex.min.css" />
    <link rel="stylesheet" href="hljs-theme.css" media="not all and (prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="hljs-theme-dark.css" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Task 078 (Amendment 15): the chat list; docked at 600 px and wider, an overlay over #scrim below. -->
    <nav id="sidebar" class="sidebar" aria-label="Chats" hidden>
      <div class="sidebar-head">
        <button id="sidebar-hide" class="icon sidebar-toggle" type="button" aria-label="Hide chats" title="Hide chats">
        <svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="1.5" y="2.5" width="13" height="11" rx="2.5"></rect>
          <path d="M6 2.5v11"></path>
        </svg>
        </button>
        <span class="sidebar-name">Chats</span>
      </div>
      <button id="sidebar-new" class="sidebar-new" type="button">
        <svg aria-hidden="true" width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M7 2v10M2 7h10"></path>
        </svg>
        New chat
      </button>
      <div id="chats" class="chats"></div>
    </nav>
    <div id="scrim" class="scrim" hidden></div>
    <div class="main">
      <header id="titlebar" class="titlebar">
        <button id="sidebar-show" class="icon sidebar-toggle" type="button" aria-label="Show chats" title="Show chats">
          <svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="1.5" y="2.5" width="13" height="11" rx="2.5"></rect>
            <path d="M6 2.5v11"></path>
          </svg>
        </button>
        <svg class="mark" aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M2 6V2h4"></path>
          <path d="M10 2h4v4"></path>
          <path d="M14 10v4h-4"></path>
          <path d="M6 14H2v-4"></path>
          <path d="M5 6.5h6"></path>
          <path d="M5 9.5h6"></path>
        </svg>
        <span class="name">snapsolve</span>
        <span id="chat-title" class="chat-title"></span>
        <button id="voice" class="icon voice" type="button" aria-label="Dictate" title="Dictate a question">
          <svg aria-hidden="true" width="12" height="13" viewBox="0 0 12 14" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="3.5" y="1" width="5" height="8" rx="2.5"></rect>
            <path d="M1.5 6.5a4.5 4.5 0 0 0 9 0M6 11v2"></path>
          </svg>
        </button>
        <button id="new-chat" class="icon new-chat" type="button" aria-label="New chat" title="New chat">
          <svg aria-hidden="true" width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M7 2v10M2 7h10"></path>
          </svg>
        </button>
        <button id="hide" class="icon hide" type="button" aria-label="Hide window" title="Hide (Esc)">
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M3 3l8 8M11 3l-8 8"></path>
          </svg>
        </button>
      </header>
      <div id="content" class="content">
        <p id="empty" class="empty">Press the snapsolve hotkey to solve what's on your screen.</p>
        <main id="threads" aria-live="polite"></main>
      </div>
      <div id="composer" class="composer">
        <label class="visually-hidden" for="follow-up">Ask a follow-up</label>
        <!-- Task 079: a pill — the mic at the left, the text, a round send at the right. -->
        <div id="composer-box" class="composer-box">
          <button id="composer-voice" class="icon voice" type="button" aria-label="Dictate" title="Dictate a question">
            <svg aria-hidden="true" width="12" height="13" viewBox="0 0 12 14" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="3.5" y="1" width="5" height="8" rx="2.5"></rect>
              <path d="M1.5 6.5a4.5 4.5 0 0 0 9 0M6 11v2"></path>
            </svg>
          </button>
          <textarea id="follow-up" rows="1" placeholder="Ask anything"></textarea>
          <button id="send" class="icon send" type="button" aria-label="Send">
            <svg aria-hidden="true" width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M7 12V2M3 6l4-4 4 4"></path>
            </svg>
          </button>
        </div>
        <!-- Task 063: while dictating, the composer is this bar (the voice hotkey again sends, Esc cancels). -->
        <div id="listening" class="listening" role="status" hidden>
          <span class="dot" aria-hidden="true"></span>
          <span class="levels" aria-hidden="true"><span class="level"></span><span class="level"></span><span class="level"></span><span class="level"></span><span class="level"></span></span>
          <span class="transcript"></span>
          <span class="hint"></span>
        </div>
        <p id="voice-note" class="voice-note" role="status" hidden></p>
      </div>
    </div>
    <div class="grip" aria-hidden="true"></div>
    <script src="renderer.js"></script>
  </body>
</html>
